name: Frontend CI
on:
  push:
    branches:
      - "main"
    paths:
      - "frontend/**"
      - ".github/workflows/test_frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/test_frontend.yml"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: melos analyze

      - name: Test
        working-directory: frontend
        run: melos test
