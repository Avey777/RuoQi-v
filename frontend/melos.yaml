name: ruoqi_flutter_ui

packages:
  - apps/**
  - packages/**

scripts:
  get:
    run: flutter pub get
    description: Resolve dependencies for the whole workspace.
  analyze:
    run: melos exec -- flutter analyze
    description: Analyze all workspace packages.
  test:
    run: melos exec -- flutter test
    description: Run tests in all workspace packages.
  gen:
    run: melos exec --depends-on build_runner -- dart run build_runner build
    description: Regenerate json_serializable output in packages that use build_runner.
  run:platform_app:
    run: melos exec --scope ruoqi_platform_app --concurrency 1 -- flutter run
    description: Run the platform mobile app.
  run:platform_pc:
    run: melos exec --scope ruoqi_platform_pc --concurrency 1 -- flutter run
    description: Run the platform PC web app.
  run:customer_app:
    run: melos exec --scope ruoqi_customer_app --concurrency 1 -- flutter run
    description: Run the customer mobile app.
  run:customer_pc:
    run: melos exec --scope ruoqi_customer_pc --concurrency 1 -- flutter run
    description: Run the customer PC web app.
  run:merchant_app:
    run: melos exec --scope ruoqi_merchant_app --concurrency 1 -- flutter run
    description: Run the merchant mobile app.
  run:merchant_pc:
    run: melos exec --scope ruoqi_merchant_pc --concurrency 1 -- flutter run
    description: Run the merchant PC web app.
  run:partner_app:
    run: melos exec --scope ruoqi_partner_app --concurrency 1 -- flutter run
    description: Run the partner mobile app.
  run:partner_pc:
    run: melos exec --scope ruoqi_partner_pc --concurrency 1 -- flutter run
    description: Run the partner PC web app.
