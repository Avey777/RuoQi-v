name: ruoqi_flutter_ui

packages:
  - apps/**
  - packages/**

scripts:
  get:
    run: flutter pub get
    description: Resolve dependencies for the whole workspace.
  analyze:
    run: melos exec -- flutter analyze
    description: Analyze all workspace packages.
  test:
    run: melos exec -- flutter test
    description: Run tests in all workspace packages.
  gen:
    run: melos exec --depends-on build_runner -- dart run build_runner build
    description: Regenerate json_serializable output in packages that use build_runner.
  run:platform:
    run: melos exec --scope ruoqi_platform --concurrency 1 -- flutter run
    description: Run the platform app.
  run:customer:
    run: melos exec --scope ruoqi_customer --concurrency 1 -- flutter run
    description: Run the customer app.
